<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:home' %}">Online Store</a>

        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'catalog:home' %}">Главная</a>
            <a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a>
        </div>
    </div>
</nav>

<main class="container py-5 flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-5 mt-auto">
    <div class="container">
        <small>© 2026 Online Store. Учебный проект на Django.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
